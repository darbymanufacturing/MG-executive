<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Omni">
  <title>Omni</title>
  <!-- Brand rust background with rounded corners -->
  <rect width="512" height="512" rx="51.2" fill="#A0521D"/>
  <!-- Asterism rays — content inside central 80% safe zone (tips at ~56–456 range) -->
  <!-- Safe zone: inset 51px from each edge on 512 canvas = coords 51..461 for full icon -->
  <!-- For maskable variant, tips inset to 56..456 -->
  <g stroke-linecap="round" fill="none">
    <!-- North ray — rust/highlight, longest -->
    <line x1="256" y1="216" x2="256" y2="60"  stroke="#FFFFFF" stroke-width="28"/>
    <!-- NE ray — ink/secondary -->
    <line x1="271" y1="225" x2="352" y2="144" stroke="#F5EDE6" stroke-width="22"/>
    <!-- East ray -->
    <line x1="280" y1="256" x2="440" y2="256" stroke="#F5EDE6" stroke-width="28"/>
    <!-- SE ray -->
    <line x1="271" y1="287" x2="340" y2="356" stroke="#F5EDE6" stroke-width="22"/>
    <!-- South ray -->
    <line x1="256" y1="296" x2="256" y2="452" stroke="#F5EDE6" stroke-width="28"/>
    <!-- SW ray -->
    <line x1="241" y1="287" x2="172" y2="356" stroke="#F5EDE6" stroke-width="22"/>
    <!-- West ray -->
    <line x1="232" y1="256" x2="80"  y2="256" stroke="#F5EDE6" stroke-width="28"/>
    <!-- NW ray -->
    <line x1="241" y1="225" x2="160" y2="144" stroke="#F5EDE6" stroke-width="22"/>
  </g>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF"/>
</svg>
